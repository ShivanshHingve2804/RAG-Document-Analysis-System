[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rag-document-analysis"
version = "1.0.0"
description = "Privacy-first RAG system for document Q&A using local LLMs (Ollama/HuggingFace) with FAISS vector search."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Shivansh Hingve", email = "shivanshhingve@gmail.com"}]
keywords = ["rag", "llm", "faiss", "langchain", "document-analysis", "pdf", "ollama", "local-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "langchain>=0.2.11",
    "langchain-community>=0.2.10",
    "langchain-huggingface>=0.0.3",
    "langchain-text-splitters>=0.2.2",
    "langchain-ollama>=0.1.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.7.0",
    "transformers>=4.42.0",
    "torch>=2.2.0",
    "accelerate>=0.31.0",
    "pypdf>=4.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-mock>=3.0"]
all = ["streamlit>=1.36.0", "pytest>=7.0", "pytest-cov>=4.0", "reportlab>=4.0"]

[project.scripts]
ragdoc = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
